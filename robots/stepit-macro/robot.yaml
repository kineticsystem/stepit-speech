# The voice commands of StepIt Macro, the focus stacking rig.
#
# The bridge reads this file when it starts: restart it after a change. Check
# a change first, without the robot:
#
#   voicebridge check robots/stepit-macro/robot.yaml
#
# and regenerate the list of commands, commands.md, next to this file:
#
#   voicebridge docs robots/stepit-macro/robot.yaml -o robots/stepit-macro/commands.md
#
# To add a command, copy one under `commands` and change it: see "Adding a
# Command" in the README. The `calls` say how the commands reach the rig, and
# rarely change.

robot:
  name: StepIt Macro
  # Said when someone connects, instead of the LLM's own greeting.
  greeting: Ready.
  description: >-
    It is a focus stacking rig for macro photography. A camera rides on a
    motorised rail, which moves it closer to the subject or farther from it.
    The rail stands on a rotary stage, a turntable that turns the subject.
    A board fires the camera and switches the lights.
  instructions: |-
    The words of the user:
    - "the rig", "the stage", "the turntable", "the table" or "the subject", when turning: the rotary stage.
    - Left is counter-clockwise, right is clockwise.
    - "the camera", "the rail" or "the focus", when moving: the rail. Closer, forward or in is toward the subject;
      back, away, farther or out is away from it.
    - "a stack", "a focus stack" or "a shoot": a focus stack. "A test shot", "a test picture" or "a photo": a test shot.
    - "f 8" or "f/8" is the aperture 8; "one over 125" or "a 125th" is the shutter speed 1/125.

# StepIt Commander's rosbridge, which knows every message of the rig.
rosbridge: ws://localhost:9090

confirmation:
  # How long a command read back waits for its yes, in seconds.
  timeout_s: 20
  # Said after every read-back.
  prompt: Confirm?
  # The whole answer must be made of these, and of fillers, to confirm.
  confirm: [yes, yeah, yep, yup, ok, okay, confirm, confirmed, go, go ahead, go with it, do it, proceed, sure,
            affirmative, correct, that's correct, that's right]
  decline: [no, nope, cancel, don't, do not, negative, never mind, wait, wrong]
  # Any of these, anywhere in what the user says, stops the rig at once, without the LLM.
  stop: [stop, halt, abort, freeze, emergency]
  fillers: [please, thanks, thank you, um, uh, oh, yes please]
  # The command the stop words run.
  stop_command: stop

# The voice can sleep. We put it to sleep in our own words, and confirm; asleep, it
# hears nothing but stop and the wake phrase, as the last sentence we say. The
# first phrase is the one the phone shows; the others are how speech-to-text may
# write it. No example may hold a stop word: "stop listening" would stop the rig.
sleep:
  wake: [Wake up, wakeup]
  examples: [go to sleep, goodnight StepIt, take a break]

# How the commands reach the rig. The calls of standard ROS 2 interfaces,
# get_parameters, set_parameters, trigger and read_latched_topic, come with
# voicebridge (src/voicebridge/robotfile/calls.yaml).
calls:
  objective:
    description: Runs an objective of StepIt Commander, a behavior tree, and waits for its end.
    action: /commander/execute_objective
    type: btcpp_ros2_interfaces/action/ExecuteTree
    request:
      target_tree: "{{ name }}"
      # The payload as one line of YAML, e.g. {deg: -10.0}; empty when there is none.
      payload: "{% if payload is defined and payload %}{{ payload | flow_yaml }}{% endif %}"
    # The goal succeeded (4) and the tree returned SUCCESS (2).
    success: "status == 4 and response.node_status.status == 2"
    # The commander's own texts, "Tree finished with status: FAILURE" and "Action Server canceling
    # and halting Behavior Tree", say nothing worth reading aloud.
    message: >-
      {{ 'it was stopped before the end' if status == 5
         else '' if not response or response.return_message.startswith(('Tree finished', 'Action Server'))
         else response.return_message }}
    # A focus stack of 350 pictures takes about half an hour.
    timeout_s: 7200

  cancel_objectives:
    description: Cancels every goal of StepIt Commander, whoever sent it.
    service: /commander/execute_objective/_action/cancel_goal
    type: action_msgs/srv/CancelGoal
    # A goal of zeros, at time zero, cancels all of them.
    request: {}
    # Cancelling nothing is not a failure: the rig is stopped either way.
    success: "true"

  set_freezer_outputs:
    description: Latches a pattern on the 16 outputs of StepIt Freezer, e.g. the lights.
    service: /freezer/set_outputs
    type: freezer_msgs/srv/SetOutputs
    request: {outputs: "{{ outputs }}"}
    success: "response.success"
    message: "{{ response.message }}"

commands:
  # ── Moving the rig ──────────────────────────────────────────────────────────

  rotate_stage:
    description: Turns the rotary stage, the turntable the subject stands on, by an angle.
    parameters:
      degrees: {type: number, min: 0.1, max: 360, description: "how far to turn, in degrees"}
      direction: [clockwise, counter-clockwise]
    say: Rotating the stage {{ degrees | plural('degree') }} {{ direction }}.
    run:
      objective:
        name: RotateStageBy
        # Counter-clockwise is negative on the rig.
        payload: {deg: "{{ -degrees if direction == 'counter-clockwise' else degrees }}"}
    done: The stage turned {{ degrees | plural('degree') }} {{ direction }}.
    examples:
      - rotate the rig 10 degrees left: {degrees: 10, direction: counter-clockwise}
      - turn the stage clockwise by 5 degrees: {degrees: 5, direction: clockwise}
      - rotate the subject right 2.5 degrees: {degrees: 2.5, direction: clockwise}

  move_camera:
    description: Moves the camera along the rail, closer to the subject or farther from it, by a distance.
    parameters:
      millimetres: {type: number, min: 0.01, max: 50, description: "how far to move, in millimetres"}
      direction: [closer, farther]
    say: Moving the camera {{ millimetres | plural('millimetre') }} {{ direction }}.
    run:
      objective:
        name: MoveRailBy
        # Toward the subject is negative on the rig.
        payload: {mm: "{{ -millimetres if direction == 'closer' else millimetres }}"}
    done: The camera moved {{ millimetres | plural('millimetre') }} {{ direction }}.
    examples:
      - move the camera closer by 1 mm: {millimetres: 1, direction: closer}
      - move the rail back half a millimetre: {millimetres: 0.5, direction: farther}
      - focus 2 millimetres further away: {millimetres: 2, direction: farther}

  go_to_mark:
    description: Moves the camera back to the near or the far mark of the focus stack, to check the focus there.
    parameters:
      mark: [near, far]
    say: Moving the camera to the {{ mark }} mark.
    run:
      objective:
        name: MoveRailToMark
        payload: {mark: "{{ mark }}"}
    done: The camera is at the {{ mark }} mark.
    examples:
      - go to the near mark: {mark: near}
      - move the camera back to the far end: {mark: far}

  manual_drive:
    description: >-
      Enables teleoperation (on), so that the rig is driven by hand, with the gamepad or the sliders, or disables
      it (off), to take the rig back for the commands.
    parameters:
      state: [on, off]
    say: "{{ 'Enabling teleoperation.' if state == 'on' else 'Disabling teleoperation.' }}"
    run:
      objective:
        name: "{{ 'ActivateTeleop' if state == 'on' else 'ActivateController' }}"
        payload: "{{ {} if state == 'on' else {'controllers': 'joint_trajectory_controller'} }}"
    done: "{{ 'Teleoperation enabled.' if state == 'on' else 'Teleoperation disabled.' }}"
    examples:
      - enable teleoperation: {state: "on"}
      - switch on manual drive: {state: "on"}
      - give me the gamepad: {state: "on"}
      - turn teleoperation off: {state: "off"}

  stop:
    description: Stops whatever the rig is doing, at once. The rig also stops whenever the user says stop.
    say: Stopping the rig.
    confirm: false
    run:
      cancel_objectives: {}
    done: Stopped.
    examples:
      - stop everything: {}
      - halt the robot: {}

  # ── Focus stacks ────────────────────────────────────────────────────────────

  mark:
    description: >-
      Marks where the camera is now as the near or the far end of the focus stack: the near end is the
      closest part of the subject in focus, the far end the farthest.
    parameters:
      end: [near, far]
    say: Marking this position as the {{ end }} end.
    run:
      objective:
        name: "{{ 'MarkNear' if end == 'near' else 'MarkFar' }}"
    done: The {{ end }} end is marked.
    examples:
      - mark the near end: {end: near}
      - this is the far point: {end: far}
      - set the near mark here: {end: near}

  set_stack:
    description: >-
      Changes the plan of the focus stack: the shots from the near end to the far one, the angles of the
      stage, and how far the stage turns either way. Give only what changes.
    parameters:
      shots: {type: integer, min: 1, max: 500, optional: true, description: "shots from the near end to the far one"}
      angles: {type: integer, min: 1, max: 360, optional: true, description: "angles of the stage"}
      turn: {type: number, min: 0, max: 180, optional: true,
             description: "how far the stage turns either way, in degrees, e.g. 17 for -17 to 17"}
    require:
      - "shots is not none or angles is not none or turn is not none": Say what to change, the shots, the angles or the turn.
    say: >-
      Setting the stack to
      {%- if shots is not none %} {{ shots }} shots{% endif %}
      {%- if angles is not none %}{% if shots is not none %},{% endif %} {{ angles }} angles{% endif %}
      {%- if turn is not none %}{% if shots is not none or angles is not none %},{% endif %} a turn of {{ turn | plural('degree') }} either way{% endif %}.
    run:
      set_parameters:
        node: /stack_state
        # stack_state keeps each value as a list of one number, as StepIt UI sets it.
        parameters:
          state.shots: "{{ [shots | float] if shots is not none else none }}"
          state.angles: "{{ [angles | float] if angles is not none else none }}"
          state.turn: "{{ [turn | float] if turn is not none else none }}"
    done: The stack is set.
    examples:
      - set the stack to 20 shots: {shots: 20}
      - use 12 angles and turn 30 degrees either way: {angles: 12, turn: 30}
      - 15 shots at 5 angles: {shots: 15, angles: 5}

  start_focus_stack:
    description: Starts a focus stack with the plan and the marks the rig holds.
    read:
      plan:
        get_parameters:
          node: /stack_state
          names: [state.shots, state.angles, state.turn, state.near, state.far]
    let:
      shots: "{{ reads.plan['state.shots'] | scalar | int }}"
      angles: "{{ reads.plan['state.angles'] | scalar | int }}"
      # One angle is where the stage stands, whatever the turn.
      turn: "{{ 0.0 if (reads.plan['state.angles'] | scalar | int) == 1 else reads.plan['state.turn'] | scalar | float }}"
    require:
      - "reads.plan['state.near'] | scalar is not none": Mark the near end first.
      - "reads.plan['state.far'] | scalar is not none": Mark the far end first.
    say: >-
      Starting a focus stack of {{ shots }} shots at {{ angles }} {{ 'angle' if angles == 1 else 'angles' }}
      {%- if angles > 1 %}, from minus {{ turn }} to {{ turn }} degrees{% endif %}: {{ shots * angles }} pictures.
    run:
      objective:
        name: FocusStack
        payload: {shots: "{{ shots }}", stage_from: "{{ -turn if turn else 0.0 }}", stage_to: "{{ turn }}", angles: "{{ angles }}"}
    started: The focus stack has started.
    done: The focus stack is finished, {{ shots * angles }} pictures.
    failed: "The focus stack stopped{{ ': ' ~ message if message else '' }}."
    examples:
      - say: start the focus stack
        expect: {}
        reads:
          plan: {state.shots: [10.0], state.angles: [35.0], state.turn: [17.0], state.near: [-12.5], state.far: [3.25]}
      - say: shoot the stack
        expect: {}
        reads:
          plan: {state.shots: [8.0], state.angles: [1.0], state.turn: [17.0], state.near: [-12.5], state.far: [3.25]}

  describe_stack:
    description: Says the plan of the focus stack and which ends are marked. Changes nothing.
    confirm: false
    read:
      plan:
        get_parameters:
          node: /stack_state
          names: [state.shots, state.angles, state.turn, state.near, state.far]
    let:
      shots: "{{ reads.plan['state.shots'] | scalar | int }}"
      angles: "{{ reads.plan['state.angles'] | scalar | int }}"
      turn: "{{ reads.plan['state.turn'] | scalar | float }}"
      near: "{{ reads.plan['state.near'] | scalar is not none }}"
      far: "{{ reads.plan['state.far'] | scalar is not none }}"
    say: >-
      The stack is {{ shots }} shots at {{ angles }} {{ 'angle' if angles == 1 else 'angles' }}
      {%- if angles > 1 %}, from minus {{ turn }} to {{ turn }} degrees{% endif %}: {{ shots * angles }} pictures.
      {% if near and far %}Both ends are marked.{% elif near %}The near end is marked, the far end is not.
      {%- elif far %}The far end is marked, the near end is not.{% else %}No end is marked yet.{% endif %}
    examples:
      - say: what is the plan of the stack
        expect: {}
        reads:
          plan: {state.shots: [10.0], state.angles: [35.0], state.turn: [17.0], state.near: [-12.5], state.far: []}

  # ── The camera, the shot and the lights ─────────────────────────────────────

  take_test_shot:
    description: Takes one test picture, to check the framing and the exposure.
    say: Taking a test shot.
    run:
      objective:
        name: TakeShot
    done: The test shot is taken.
    failed: "The test shot failed{{ ': ' ~ message if message else '' }}."
    examples:
      - do a test shot: {}
      - take a picture: {}

  set_camera:
    description: >-
      Changes a setting of the camera. The value is as the camera writes it: an ISO such as 400 or Auto,
      a shutter speed such as 1/125 or 2, an aperture such as 8 or 5.6, an exposure compensation such as
      -1 or 0.3, a white balance such as Auto, Daylight or Cloudy.
    parameters:
      setting: [iso, shutter_speed, aperture, exposure_compensation, white_balance]
      value: {type: string, description: "the value as the camera writes it, e.g. 400, 1/125, 5.6 or Daylight"}
    let:
      spoken: "{{ {'iso': 'the ISO', 'shutter_speed': 'the shutter speed', 'aperture': 'the aperture',
                  'exposure_compensation': 'the exposure compensation', 'white_balance': 'the white balance'}[setting] }}"
    say: Setting {{ spoken }} to {{ value }}.
    run:
      set_parameters:
        node: /camera
        parameters: {"{{ setting }}": "{{ value }}"}
    done: "{{ spoken[0] | upper }}{{ spoken[1:] }} is {{ value }}."
    failed: "The camera refused: {{ message }}."
    examples:
      - set the ISO to 400: {setting: iso, value: "400"}
      - aperture f 8: {setting: aperture, value: "8"}
      - shutter speed one over 125: {setting: shutter_speed, value: "1/125"}
      - white balance daylight: {setting: white_balance, value: Daylight}

  live_view:
    description: Starts or stops the live view of the camera.
    parameters:
      state: [on, off]
    say: "{{ 'Starting' if state == 'on' else 'Stopping' }} the live view."
    run:
      trigger:
        service: "{{ '/camera/start_streaming' if state == 'on' else '/camera/stop_streaming' }}"
    done: The live view is {{ state }}.
    examples:
      - turn on the live view: {state: "on"}
      - live view off: {state: "off"}

  lights:
    description: Switches the lights of the rig on or off.
    parameters:
      state: [on, off]
    read:
      outputs:
        read_latched_topic: {topic: /freezer/outputs, type: freezer_msgs/msg/Outputs}
    say: Switching the lights {{ state }}.
    run:
      set_freezer_outputs:
        # The lights close both lines of jack OUT1: bits 0 and 1, the mask 3. The other outputs stay as they are.
        outputs: "{{ reads.outputs.outputs | bit_or(3) if state == 'on' else reads.outputs.outputs | bit_and_not(3) }}"
    done: The lights are {{ state }}.
    examples:
      - say: lights on
        expect: {state: "on"}
        reads:
          outputs: {outputs: 0, shot_id: 0, step: 0}
      - say: switch the lights off
        expect: {state: "off"}
        reads:
          outputs: {outputs: 3, shot_id: 0, step: 0}

  # ── What the rig is doing ───────────────────────────────────────────────────

  report_status:
    description: Says what the rig is doing now. Changes nothing.
    confirm: false
    read:
      objective:
        read_latched_topic: {topic: /stepit_server/objective, type: std_msgs/msg/String}
    say: "{{ ('The rig is running ' ~ reads.objective.data ~ '.') if reads.objective.data else 'The rig is idle.' }}"
    examples:
      - say: what is the rig doing
        expect: {}
        reads:
          objective: {data: FocusStack}
      - say: is anything running
        expect: {}
        reads:
          objective: {data: ""}

  report_progress:
    description: Says how far the running or the last focus stack is. Changes nothing.
    confirm: false
    read:
      progress:
        read_latched_topic: {topic: /focus_stack/progress, type: stepit_macro_msgs/msg/StackProgress}
    say: "{{ reads.progress.done }} of {{ reads.progress.total }} pictures are taken."
    examples:
      - say: how far is the stack
        expect: {}
        reads:
          progress: {done: 120, total: 350}
