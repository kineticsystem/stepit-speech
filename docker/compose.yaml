# The whole voice, started together by ./docker/dock.sh serve: llama-server on
# Ternary Bonsai 2 27B, then the bridge, once the model is loaded, then the
# speech server. All three use the host's network: the phone or the browser
# reaches the bridge on 8766, which reaches the speech server on 8765, which
# reaches the bridge's LLM proxy on 8767, which asks llama-server on 8085.
#
# dock.sh sets ROBOT, HOST_UID and HOST_GID, downloads the model, and makes the
# speech server's cache folders, so that they are the user's, not root's.

name: stepit-speech

services:
  llm:
    image: stepit-speech-llm
    build:
      context: ../engines/llama.cpp
      dockerfile: ../../docker/llm.Dockerfile
      args:
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-89}
    network_mode: host
    gpus: all
    volumes:
      - ../models:/models:ro
    # One model, always loaded, for one voice. The model card's sampling. No thinking:
    # a command is one JSON object, and thinking first only makes the answer slower.
    command:
      - --model
      - /models/Ternary-Bonsai-2-27B-Q2_0-prism-fork-required.gguf
      - --alias
      - bonsai-2-27b
      - --host
      - 127.0.0.1
      - --port
      - "${LLM_PORT:-8085}"
      - --parallel
      - "1"
      - --ctx-size
      - "8192"
      - --n-gpu-layers
      - "999"
      - --flash-attn
      - "on"
      - --jinja
      - --reasoning
      - "off"
      - --temp
      - "1.0"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --min-p
      - "0.05"
      - --no-ui
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:${LLM_PORT:-8085}/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      # Loading 7.6 GB into the GPU.
      start_period: 300s
      start_interval: 2s

  bridge:
    image: stepit-speech
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      VOICEBRIDGE_LLM_URL: http://127.0.0.1:${LLM_PORT:-8085}/v1
      VOICEBRIDGE_UPSTREAM:
      VOICEBRIDGE_ROSBRIDGE:
      VOICEBRIDGE_LISTEN:
      VOICEBRIDGE_LLM_LISTEN:
    command: ["voicebridge", "serve", "${ROBOT:-robots/stepit-macro/robot.yaml}"]
    depends_on:
      llm:
        condition: service_healthy

  # The speech server, on 8765: it listens, transcribes, asks the bridge's LLM proxy
  # on 8767 and speaks. Its models are the host's, in ~/.cache: the speech-to-text,
  # the voice and the voice detection that `uv run speech-to-speech` downloads too.
  # About a minute to load; it listens on 127.0.0.1 only, as the bridge is its client.
  speech:
    image: stepit-speech-speech
    build:
      context: ../engines/speech-to-speech
      dockerfile: ../../docker/speech.Dockerfile
    network_mode: host
    gpus: all
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ${HOME}/.cache/huggingface:/home/voice/.cache/huggingface
      - ${HOME}/.cache/torch:/home/voice/.cache/torch
      - ${HOME}/.cache/faster-qwen3-tts:/home/voice/.cache/faster-qwen3-tts
    # The bridge's LLM proxy, never llama-server directly: otherwise the LLM writes the
    # read-backs in its own words. No summaries of older turns: they would retell the
    # read-backs as the model's own actions. The voice in 8 bits saves 1.6 GB of the GPU.
    command:
      - serve
      - --llm_backend
      - chat-completions
      - --responses_api_base_url
      - http://127.0.0.1:8767/v1
      - --responses_api_api_key
      - ""
      - --model_name
      - bonsai-2-27b
      - --compact_history
      - "false"
      - --qwen3_tts_ggml_quantization
      - Q8_0
      # A short "yes" has 200 to 350 ms of voice: the default, 384, threw most of ours away.
      - --min_speech_ms
      - "192"
    depends_on:
      bridge:
        condition: service_started
